[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaman-ai"
version = "0.2.0"
description = "Local-first System One decision engine — sub-20ms edge inference via quantized bidirectional encoders."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "numpy>=1.24.0",
]

[project.scripts]
gaman = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── mypy ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["scripts/"]

# ── ruff ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ── pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]
